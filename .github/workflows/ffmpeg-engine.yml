# The test suite on Linux with a real ffmpeg, for the engine: its copies, and
# the pause ahead of the watcher, which only Linux has (SIGSTOP).
name: ffmpeg engine tests
on:
  push:
    branches: [feature/ffmpeg-engine]
    paths:
      - packages/**
      - package.json
      - package-lock.json
      - .github/workflows/ffmpeg-engine.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg
      - run: npm ci
      - run: npm run build
      - run: npx tsc --noEmit -p packages/client
      - run: npm test
        env:
          DATA_DIR: ${{ runner.temp }}/theater-tests
