# Build and publish the container image for a tagged release.
#
# Triggered by pushing a v* tag. The image lands in this repository's GitHub
# Packages as ghcr.io/<owner>/plex-discord-theater, which is what `docker pull`
# in the README points at for anyone who does not want to build it themselves.
name: Release

on:
  push:
    tags:
      - "v*"
  # So a failed publish can be retried without moving the tag.
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: read
  packages: write

jobs:
  # Nothing gets published that does not build and pass its tests first. The
  # image build below runs `npm run build` on its own, so this job exists for
  # the part that would otherwise never run: the test suite and a typecheck of
  # the client, which `tsc --noEmit` covers and the Dockerfile does not.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit -p packages/client

      - name: Test
        run: npm test

  publish:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}

      # The Discord application id is compiled into the client bundle by Vite
      # (see useDiscord.ts), so the image is built for one Discord app and
      # cannot pick this up at runtime. It is a public identifier — it appears
      # in every OAuth URL — so it lives in a repository *variable* rather than
      # a secret.
      #
      # Checked rather than allowed to default: an empty value builds a
      # perfectly healthy image whose Activity never initialises, which is a
      # miserable thing to discover after publishing it.
      - name: Require DISCORD_CLIENT_ID
        env:
          CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: |
          if [ -z "$CLIENT_ID" ]; then
            echo "::error::Repository variable DISCORD_CLIENT_ID is not set."
            echo "Set it under Settings → Secrets and variables → Actions → Variables."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Package names have to be lowercase; repository owners do not have to be.
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ steps.image.outputs.name }}
          # v1.0.0 publishes 1.0.0, 1.0 and 1. `latest` is left to the action's
          # default flavour, which adds it for the highest semver tag and — the
          # reason for not hardcoding it — withholds it from a prerelease.
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # amd64 only, matching the repo's own `docker:build` script. better-sqlite3
      # compiles a native addon, and building arm64 under QEMU turns a two minute
      # job into a twenty minute one — worth adding when someone actually needs
      # it, not before.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_DISCORD_CLIENT_ID=${{ vars.DISCORD_CLIENT_ID }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
