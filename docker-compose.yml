# Two ways to run this, from one file.
#
#   docker compose up -d            builds from this checkout
#   docker compose pull && up -d    uses the published image instead
#
# `image` names the result either way, so a local build is tagged the same as
# the published one and `pull` has something to fetch.
#
# Deploying through Portainer or Dockge instead? The README carries a
# self-contained version of this with every value inline, so no .env is needed.
services:
  app:
    container_name: plex-discord-theater
    # Pin to a release tag (e.g. :1.0.0) if you would rather updates be
    # deliberate than automatic.
    image: ghcr.io/monkeygonewild/plex-discord-theater:latest
    build:
      context: .
    ports:
      - "${PORT:-3000}:${PORT:-3000}"

    # Everything below is read from your .env file. Copy .env.example to .env
    # and fill in the required block; the rest can stay empty, and each one
    # simply turns its feature off — except Direct Stream and HEVC, which are
    # on unless set to 0. See .env.example for what each does.
    #
    # All of it is read at runtime, DISCORD_CLIENT_ID included — the server
    # hands that one to the browser on each request rather than it being
    # compiled in, so changing any of these needs a restart, not a rebuild.
    environment:
      # ── Required ────────────────────────────────────────────────
      - NODE_ENV=production
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PORT=${PORT:-3000}
      # Where the SQLite databases and logs live — matches the volume below.
      - THUMB_CACHE_DIR=/data

      # ── Optional integrations ───────────────────────────────────
      # All off unless set. The server prints which are live at startup:
      #   docker compose logs | grep Config
      #
      # Your plex.tv ACCOUNT token (not the server token above). Enables detail
      # pages for titles you don't own, and signs in to Seerr as you.
      - PLEX_ACCOUNT_TOKEN=${PLEX_ACCOUNT_TOKEN}
      # Stable encryption key for per-user Plex account links. Falls back to
      # DISCORD_CLIENT_SECRET when unset.
      - PLEX_LINK_SECRET=${PLEX_LINK_SECRET}
      # Collections, "More Like This", and cast/crew pages.
      - TMDB_API_KEY=${TMDB_API_KEY}
      # Correct season numbering for the missing-episode list. TVDB is what
      # Sonarr monitors, so without this the list falls back to TMDB, which
      # sometimes disagrees about which season an episode belongs to.
      # TVDB_PIN is only needed for a user-supported subscriber key.
      - TVDB_API_KEY=${TVDB_API_KEY}
      - TVDB_PIN=${TVDB_PIN}
      # Overseerr / Jellyseerr URL — enables the Request button.
      - SEERR_URL=${SEERR_URL}
      # Restrict the activity to named Discord servers. Empty = any server.
      - ALLOWED_GUILD_IDS=${ALLOWED_GUILD_IDS}
      # Route HLS segments through a VPS so your home connection uploads one
      # stream instead of one per viewer. See docs/vps-relay-setup.md.
      - VPS_RELAY_URL=${VPS_RELAY_URL}
      - VPS_RELAY_KEY=${VPS_RELAY_KEY}

      # ── Playback engine ─────────────────────────────────────────
      # plex (the default) has Plex make every stream. ffmpeg makes them in
      # this container instead, from the files themselves: copies of the
      # original picture, HDR included, and re-encodes on the GPU (Intel Quick
      # Sync, VAAPI or NVIDIA NVENC) when one is mapped in under `devices`
      # below, else on the CPU. Each stream's whole film is made ahead into
      # STREAM_CACHE_DIR: leave room for it. Anything it can't make is left to
      # Plex. Uncomment the media mount and `devices` below with it. See the
      # wiki's FFmpeg Engine page.
      - PLAYBACK_ENGINE=${PLAYBACK_ENGINE:-}
      # Only when the library is mounted at other paths than Plex's own:
      # "plex path=>path here", comma-separated, e.g. /media=>/data/media
      - MEDIA_PATH_MAP=${MEDIA_PATH_MAP:-}
      # auto (the default) uses Intel QSV when it works, else VAAPI, else the
      # CPU; qsv, vaapi, nvenc or none choose. FFMPEG_HWACCEL_DEVICE is the
      # render node. FFMPEG_HW_DECODE=off decodes on the CPU.
      - FFMPEG_HWACCEL=${FFMPEG_HWACCEL:-}
      - FFMPEG_HWACCEL_DEVICE=${FFMPEG_HWACCEL_DEVICE:-}
      - FFMPEG_HW_DECODE=${FFMPEG_HW_DECODE:-}
      # Re-encodes at once; past it, Plex makes the stream. Copies don't count.
      # Empty = 6 on the GPU, 2 on the CPU.
      - FFMPEG_MAX_ENCODES=${FFMPEG_MAX_ENCODES:-}
      # ultrafast to veryslow; empty = each encoder's own.
      - FFMPEG_PRESET=${FFMPEG_PRESET:-}
      # Empty = the whole film made ahead; seconds = held that far ahead.
      - FFMPEG_LOOKAHEAD=${FFMPEG_LOOKAHEAD:-}
      # 6 = surround the player can't play becomes 5.1 AAC, not stereo.
      - FFMPEG_AUDIO_CHANNELS=${FFMPEG_AUDIO_CHANNELS:-}
      # off = text subtitles read by Plex, not out of the file here.
      - FFMPEG_SUBTITLES=${FFMPEG_SUBTITLES:-}
      # off = no seek-bar previews made for files Plex has none for.
      - FFMPEG_PREVIEWS=${FFMPEG_PREVIEWS:-}
      - FFMPEG_PREVIEWS_MAX_GB=${FFMPEG_PREVIEWS_MAX_GB:-}
      # Memory for the segments rooms are fetching now. Empty = 512.
      - FFMPEG_SEGMENT_MEMORY_MB=${FFMPEG_SEGMENT_MEMORY_MB:-}
      # off = a stream ffmpeg can't make fails, rather than going to Plex.
      - FFMPEG_FALLBACK_TO_PLEX=${FFMPEG_FALLBACK_TO_PLEX:-}
      # keep (the default): a re-encode for an HEVC player stays HDR, as the
      # copy is. tonemap maps it to SDR, as Plex does. FFMPEG_TONEMAP is the
      # curve for streams that are mapped: reinhard (default), mobius, hable,
      # bt2390, linear, gamma or clip.
      - FFMPEG_HDR_REENCODE=${FFMPEG_HDR_REENCODE:-}
      - FFMPEG_TONEMAP=${FFMPEG_TONEMAP:-}
      # Tell Plex what ffmpeg is playing, so it shows in Plex's dashboard,
      # Tautulli and Tracearr. On unless set to 0.
      - FFMPEG_REPORT_TO_PLEX=${FFMPEG_REPORT_TO_PLEX:-}

      # ── Tuning ──────────────────────────────────────────────────
      # Per-viewer bandwidth scales with the bitrate — the biggest lever there
      # is if your upload is tight.
      - VIDEO_BITRATE_KBPS=${VIDEO_BITRATE_KBPS}
      - VIDEO_PEAK_BITRATE_KBPS=${VIDEO_PEAK_BITRATE_KBPS}
      # HEVC transcodes for players that can decode them; anyone who can't
      # gets an H.264 stream of their own. Needs Plex Pass and hardware HEVC
      # encoding enabled in Plex; without them Plex keeps sending H.264.
      # On unless set to 0.
      - HEVC_TRANSCODE=${HEVC_TRANSCODE:-1}
      # Copy the original video instead of re-encoding it, for players that
      # can decode it. Files averaging over DIRECT_STREAM_MAX_KBPS are still
      # re-encoded. On unless set to 0.
      - DIRECT_STREAM=${DIRECT_STREAM:-1}
      # Highest average bitrate (kbps) still copied; bigger files are
      # re-encoded so a home upload isn't asked for more than it has.
      # Unset = VIDEO_BITRATE_KBPS.
      - DIRECT_STREAM_MAX_KBPS=${DIRECT_STREAM_MAX_KBPS:-}
      # Films being played, kept so going back plays from here: copies in
      # memory up to DIRECT_STREAM_MEMORY_MB (6144) and the rest on disk in
      # STREAM_CACHE_DIR (/data/stream-cache) until the stream ends;
      # re-encodes TRANSCODE_CACHE_MB (2048) in memory. Point STREAM_CACHE_DIR
      # at an SSD — see the commented volume below.
      - DIRECT_STREAM_MEMORY_MB=${DIRECT_STREAM_MEMORY_MB:-}
      - STREAM_CACHE_DIR=${STREAM_CACHE_DIR:-}
      - TRANSCODE_CACHE_MB=${TRANSCODE_CACHE_MB:-}
      # 0 = don't read a title's other subtitles out of the file ahead of
      # anyone picking them. On unless set to 0.
      - SUBTITLE_PREFETCH=${SUBTITLE_PREFETCH:-}
      - THUMB_CACHE_TTL_MS=${THUMB_CACHE_TTL_MS}
      # Image cache size, with a unit: 500M, 10G (the default), 2T.
      - THUMB_CACHE_MAX_SIZE=${THUMB_CACHE_MAX_SIZE}
      - THUMB_CACHE_MAX_MB=${THUMB_CACHE_MAX_MB}
      # Background pre-fetch of detail-page data and artwork, seasons and
      # episodes included, so opening a title is a cache hit instead of several
      # round trips. WARM_CACHE=0 turns it off; WARM_CACHE_ARTWORK=0 and
      # WARM_CACHE_EPISODES=0 turn off those parts.
      - WARM_CACHE=${WARM_CACHE}
      - WARM_CACHE_MAX_ITEMS=${WARM_CACHE_MAX_ITEMS}
      - WARM_CACHE_DELAY_MS=${WARM_CACHE_DELAY_MS}
      - WARM_CACHE_INTERVAL_MIN=${WARM_CACHE_INTERVAL_MIN}
      - WARM_CACHE_ARTWORK=${WARM_CACHE_ARTWORK}
      - WARM_CACHE_EPISODES=${WARM_CACHE_EPISODES}

      # ── Diagnostics ─────────────────────────────────────────────
      # Server and client events are written to /data/logs, so a stream that
      # died can be read back after the container logs have rolled away.
      - LOG_TO_FILE=${LOG_TO_FILE}
      - LOG_DIR=${LOG_DIR}
      - LOG_MAX_FILE_MB=${LOG_MAX_FILE_MB}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS}
      # DEBUG=1 adds a line per HLS segment, keep-alive and prefetch poll —
      # useful while chasing a specific stream, and roughly five times the log
      # volume the rest of the time.
      - DEBUG=${DEBUG:-}
      # Password for one maintenance command that stops every stream the bot
      # has running on Plex, for clearing stuck ones by hand. Empty, it is
      # accepted only from inside the container, which suits most people.
      - ADMIN_SECRET=${ADMIN_SECRET}
      - QBT_MANAGER_API_KEY=${QBT_MANAGER_API_KEY:-}

    volumes:
      # SQLite (sessions, watch history, linked Plex accounts, detail metadata,
      # thumbnail cache), logs, and the stream cache of films being played
      # unless STREAM_CACHE_DIR points elsewhere. A named volume keeps them
      # across rebuilds; swap for a host path (e.g. ./data:/data) if you'd
      # rather have them somewhere you can browse.
      - app-data:/data
      # A copied film being played past DIRECT_STREAM_MEMORY_MB goes to disk,
      # up to 13.5 GB an hour for a 30 Mbps Blu-ray. To keep that on an SSD,
      # mount one here and set STREAM_CACHE_DIR=/cache/stream in .env.
      # - /path/to/ssd/theater-stream-cache:/cache/stream
      # PLAYBACK_ENGINE=ffmpeg: your library, read-only, at the path Plex has
      # it (or set MEDIA_PATH_MAP). Without it, ffmpeg reads each file from
      # Plex over the network instead, which works but seeks slower.
      # - /path/to/media:/data/media:ro

    # PLAYBACK_ENGINE=ffmpeg: Intel's GPU, for re-encodes on Quick Sync.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
