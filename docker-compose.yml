# Two ways to run this, from one file:
#   docker compose up -d            builds from this checkout
#   docker compose pull && up -d    uses the published image
#
# Settings are read from your .env file: copy .env.example to .env and fill in
# the required block. Deploying through Portainer, Dockge or Dockhand instead?
# The README has a self-contained version with every value inline.
services:
  app:
    container_name: plex-discord-theater
    image: ghcr.io/monkeygonewild/plex-discord-theater:latest # Pin a release tag, such as :2.2.0, for deliberate updates.
    build:
      context: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
      # - "${ADMIN_PORT:-3050}:${ADMIN_PORT:-3050}" # The dashboard (set ADMIN_PASSWORD). Keep it on your local network.
    extra_hosts:
      - "host.docker.internal:host-gateway" # Lets PLEX_URL=http://host.docker.internal:32400 reach Plex on this machine.
    volumes:
      - app-data:/data # Databases, caches, logs and the video being played. Kept across updates.
      # - /path/to/ssd/theater-stream-cache:/cache/stream # Optional: keep video being played on an SSD (set STREAM_CACHE_DIR=/cache/stream).
      # - /path/to/media:/data/media:ro # FFmpeg engine: your library, read-only, at the path Plex has it (or set MEDIA_PATH_MAP).
    # devices: # FFmpeg engine: the GPU, for Intel Quick Sync or VAAPI.
    #   - /dev/dri:/dev/dri
    environment:
      # ── Required ────────────────────────────────────────────────
      - NODE_ENV=production
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID} # From the Discord Developer Portal: Application ID.
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET} # From the Discord Developer Portal: Client Secret.
      - PLEX_URL=${PLEX_URL} # Plex as this container reaches it. Never localhost.
      - PLEX_TOKEN=${PLEX_TOKEN} # Your Plex server's X-Plex-Token.
      - REDIRECT_URI=${REDIRECT_URI} # Your public HTTPS address, no trailing slash.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS} # The same address.
      - PORT=${PORT:-3000} # The port the server listens on.
      - THUMB_CACHE_DIR=/data # Leave as it is: it matches the volume above.

      # ── Streaming ───────────────────────────────────────────────
      - DIRECT_STREAM=${DIRECT_STREAM:-1} # Send the original video unchanged when a device can play it. 0 transcodes everything.
      - DIRECT_STREAM_MAX_KBPS=${DIRECT_STREAM_MAX_KBPS:-100000} # Highest average bitrate (kbps) a file may have and still be sent unchanged.
      - VIDEO_BITRATE_KBPS=${VIDEO_BITRATE_KBPS:-20000} # Average bitrate of a transcode (kbps).
      - VIDEO_PEAK_BITRATE_KBPS=${VIDEO_PEAK_BITRATE_KBPS:-200000} # Peak bitrate of a transcode (kbps).
      - HEVC_TRANSCODE=${HEVC_TRANSCODE:-1} # HEVC transcodes for devices that play HEVC. 0 keeps them H.264.
      - AV1_TRANSCODE=${AV1_TRANSCODE:-} # FFmpeg engine: AV1 transcodes for devices that play AV1 in hardware. 0 turns it off.
      - DIRECT_STREAM_MEMORY_MB=${DIRECT_STREAM_MEMORY_MB:-} # Memory for video sent unchanged, all streams together. Default 6144.
      - TRANSCODE_CACHE_MB=${TRANSCODE_CACHE_MB:-} # Memory for transcoded video, all streams together. Default 2048.
      - STREAM_CACHE_DIR=${STREAM_CACHE_DIR:-} # Where video being played is kept on disk. Default /data/stream-cache. Emptied at every start.
      - SUBTITLE_PREFETCH=${SUBTITLE_PREFETCH:-} # 0 stops reading a title's other subtitles ahead.
      - STYLED_SUBTITLES=${STYLED_SUBTITLES:-} # off draws ASS subtitles as plain lines.

      # ── Recommended ─────────────────────────────────────────────
      - PLEX_ACCOUNT_TOKEN=${PLEX_ACCOUNT_TOKEN} # Your plex.tv account token: pages for titles you don't own, and Seerr sign-in.
      - TMDB_API_KEY=${TMDB_API_KEY} # Collections, More Like This and cast pages.
      - TVDB_API_KEY=${TVDB_API_KEY} # Missing-episode lists numbered as Sonarr numbers them.
      - TVDB_PIN=${TVDB_PIN} # Only for a TVDB subscriber key.

      # ── Optional ────────────────────────────────────────────────
      - SEERR_URL=${SEERR_URL} # The Request button, through Overseerr or Jellyseerr.
      - ALLOWED_GUILD_IDS=${ALLOWED_GUILD_IDS} # Only these Discord servers may use it: server IDs, comma-separated.
      - HOST_REQUESTS=${HOST_REQUESTS:-} # off stops viewers asking an away host for the host role.
      - PLEX_LINK_SECRET=${PLEX_LINK_SECRET} # A stable key for linked Plex accounts. Defaults to DISCORD_CLIENT_SECRET.
      - QBT_MANAGER_API_KEY=${QBT_MANAGER_API_KEY:-} # plex-qbt-manager's THEATER_API_KEY, for its upload limits.
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:-} # Turns on the dashboard. Use 12 characters or more.
      - ADMIN_PORT=${ADMIN_PORT:-3050} # The dashboard's port.
      - ADMIN_HOST=${ADMIN_HOST:-} # The address the dashboard listens on. Default 0.0.0.0.
      - ADMIN_SECRET=${ADMIN_SECRET} # Password for the maintenance command that stops every stream on Plex.

      # ── The FFmpeg engine (optional) ────────────────────────────
      - PLAYBACK_ENGINE=${PLAYBACK_ENGINE:-} # ffmpeg makes the streams in this container. Default plex.
      - MEDIA_PATH_MAP=${MEDIA_PATH_MAP:-} # Only if Plex sees the library at other paths: Plex's path=>path here, comma-separated.
      - FFMPEG_HWACCEL=${FFMPEG_HWACCEL:-} # auto (default), qsv, vaapi, nvenc, or none for the CPU.
      - FFMPEG_HWACCEL_DEVICE=${FFMPEG_HWACCEL_DEVICE:-} # The GPU's render node. Default /dev/dri/renderD128.
      - FFMPEG_HW_DECODE=${FFMPEG_HW_DECODE:-} # off decodes on the CPU and keeps encoding on the GPU.
      - FFMPEG_MAX_ENCODES=${FFMPEG_MAX_ENCODES:-} # Transcodes at once. Default 6 on a GPU, 2 on the CPU.
      - FFMPEG_PRESET=${FFMPEG_PRESET:-} # ultrafast to veryslow. Default: each encoder's own.
      - FFMPEG_LOOKAHEAD=${FFMPEG_LOOKAHEAD:-} # Seconds each stream is made ahead. Default: the whole film.
      - FFMPEG_AUDIO_CHANNELS=${FFMPEG_AUDIO_CHANNELS:-} # 2 converts surround a device can't play to stereo. Default 6.
      - FFMPEG_SUBTITLES=${FFMPEG_SUBTITLES:-} # off leaves reading text subtitles to Plex.
      - FFMPEG_PGS=${FFMPEG_PGS:-} # off burns Blu-ray and DVD subtitles in.
      - FFMPEG_PGS_MAX_GB=${FFMPEG_PGS_MAX_GB:-} # Disk for those subtitles. Default 2.
      - FFMPEG_PREVIEWS=${FFMPEG_PREVIEWS:-} # off stops making seek-bar previews.
      - FFMPEG_PREVIEWS_MAX_GB=${FFMPEG_PREVIEWS_MAX_GB:-} # Disk for previews. Default 20.
      - FFMPEG_SEGMENT_MEMORY_MB=${FFMPEG_SEGMENT_MEMORY_MB:-} # Memory for the video rooms are fetching now. Default 512.
      - FFMPEG_HDR_REENCODE=${FFMPEG_HDR_REENCODE:-} # keep (default) or tonemap.
      - FFMPEG_TONEMAP=${FFMPEG_TONEMAP:-} # The curve used when HDR is mapped to SDR. Default mobius.
      - FFMPEG_HDR_ON_SDR=${FFMPEG_HDR_ON_SDR:-} # HDR on an SDR screen: browser (default) or server.
      - FFMPEG_HDR_ON_SDR_NITS=${FFMPEG_HDR_ON_SDR_NITS:-} # The peak HDR is labelled with for an SDR screen. Default 200.
      - FFMPEG_REPORT_TO_PLEX=${FFMPEG_REPORT_TO_PLEX:-} # 0 stops showing the engine's streams in Plex's dashboard.
      - FFMPEG_FALLBACK_TO_PLEX=${FFMPEG_FALLBACK_TO_PLEX:-} # off makes a stream the engine can't make fail. For testing.

      # ── Caches and warm-up ──────────────────────────────────────
      - THUMB_CACHE_TTL_MS=${THUMB_CACHE_TTL_MS} # How long artwork is kept. Default 90 days.
      - THUMB_CACHE_MAX_SIZE=${THUMB_CACHE_MAX_SIZE} # Artwork cache size, with a unit: 500M, 10G (default), 2T.
      - THUMB_CACHE_MAX_MB=${THUMB_CACHE_MAX_MB} # The older form of the size, in megabytes.
      - WARM_CACHE=${WARM_CACHE} # 0 turns off preparing title pages in the background.
      - WARM_CACHE_MAX_ITEMS=${WARM_CACHE_MAX_ITEMS} # Titles kept prepared. Default 600, or all.
      - WARM_CACHE_DELAY_MS=${WARM_CACHE_DELAY_MS} # Pause after each request to Plex. Default 250.
      - WARM_CACHE_INTERVAL_MIN=${WARM_CACHE_INTERVAL_MIN} # Minutes between passes. Default 240.
      - WARM_CACHE_ARTWORK=${WARM_CACHE_ARTWORK} # 0 leaves artwork to load when first shown.
      - WARM_CACHE_EPISODES=${WARM_CACHE_EPISODES} # 0 skips seasons and episodes.

      # ── Logging ─────────────────────────────────────────────────
      - LOG_TO_FILE=${LOG_TO_FILE} # 0 logs to the console only.
      - LOG_DIR=${LOG_DIR} # Where log files are written. Default /data/logs.
      - LOG_MAX_FILE_MB=${LOG_MAX_FILE_MB} # Size at which a day's log continues in a new file. Default 64.
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS} # Days of logs kept. Default 7.
      - DEBUG=${DEBUG:-} # 1 logs every request in detail. About five times the volume.
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
