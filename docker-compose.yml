services:
  app:
    container_name: plex-discord-theater
    build:
      context: .
      args:
        VITE_DISCORD_CLIENT_ID: ${DISCORD_CLIENT_ID}
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=production
      - PLEX_URL=${PLEX_URL}
      - PLEX_TOKEN=${PLEX_TOKEN}
      - PLEX_ACCOUNT_TOKEN=${PLEX_ACCOUNT_TOKEN}
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - REDIRECT_URI=${REDIRECT_URI}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - ALLOWED_GUILD_IDS=${ALLOWED_GUILD_IDS}
      - VPS_RELAY_URL=${VPS_RELAY_URL}
      - VPS_RELAY_KEY=${VPS_RELAY_KEY}
      - SEERR_URL=${SEERR_URL}
      - TMDB_API_KEY=${TMDB_API_KEY}
      # Ratings row. Unset, /api/ratings answers configured:false and the row
      # simply never appears — which looked like a bug when the key was set in
      # .env but stopped here.
      - MDBLIST_API_KEY=${MDBLIST_API_KEY}
      - ADMIN_SECRET=${ADMIN_SECRET}
      # The bandwidth levers. Documented in .env.example as the biggest one
      # available, and unreachable from here until now.
      - VIDEO_BITRATE_KBPS=${VIDEO_BITRATE_KBPS}
      - VIDEO_PEAK_BITRATE_KBPS=${VIDEO_PEAK_BITRATE_KBPS}
      # ffmpeg transcode tuning. HWACCEL=vaapi (or qsv) offloads the H.264 encode
      # to an Intel QuickSync GPU — see the devices/group_add below, which must be
      # uncommented for the container to reach /dev/dri.
      - HWACCEL=${HWACCEL:-none}
      - HWACCEL_DEVICE=${HWACCEL_DEVICE:-/dev/dri/renderD128}
      - FFMPEG_PRESET=${FFMPEG_PRESET}
      - SEG_SECONDS=${SEG_SECONDS}
      - MAX_TRANSCODE_SESSIONS=${MAX_TRANSCODE_SESSIONS}
      - WARM_CACHE=${WARM_CACHE}
      - WARM_CACHE_MAX_ITEMS=${WARM_CACHE_MAX_ITEMS}
      - WARM_CACHE_DELAY_MS=${WARM_CACHE_DELAY_MS}
      - WARM_CACHE_INTERVAL_MIN=${WARM_CACHE_INTERVAL_MIN}
      - LOG_TO_FILE=${LOG_TO_FILE}
      - LOG_DIR=${LOG_DIR}
      - LOG_MAX_FILE_MB=${LOG_MAX_FILE_MB}
      - LOG_RETENTION_DAYS=${LOG_RETENTION_DAYS}
      - THUMB_CACHE_TTL_MS=${THUMB_CACHE_TTL_MS}
      - THUMB_CACHE_MAX_MB=${THUMB_CACHE_MAX_MB}
      - PORT=${PORT:-3000}
      - THUMB_CACHE_DIR=/data
      # Set DEBUG=1 to turn on verbose HLS segment/session logging.
      - DEBUG=${DEBUG:-}
    volumes:
      - app-data:/data
    # ── Intel QuickSync (HWACCEL=vaapi|qsv) ──────────────────────────────
    # Uncomment to give the container the Intel GPU. `group_add` must include the
    # GID that owns /dev/dri/renderD128 on the host — find it with:
    #   getent group render   (or:  stat -c '%g' /dev/dri/renderD128)
    # devices:
    #   - /dev/dri:/dev/dri
    # group_add:
    #   - "989"   # ← replace with your host's render group GID
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  app-data:
