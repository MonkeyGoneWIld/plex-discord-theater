<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Plex Discord Theater</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        font-family: 'DM Sans', sans-serif;
        background: #0d0d0d;
        color: #f0f0f0;
        min-height: 100vh;
      }
      #root { min-height: 100vh; }

      /* Safe areas.
         Discord reports how much of the viewport its own chrome covers on
         mobile — the header strip and Leave pill, the collapse chevron — as
         these custom properties, and they track orientation changes for us.
         The env() fallback covers iOS device notches and any dev testing done
         outside Discord; the 0px inside it keeps the declaration valid where
         there is no inset at all.
         Deliberately NOT applied to <body>, which is what Discord's own example
         does: that would inset the player too and letterbox the video. Only the
         bars that hold controls take them — see the calc() paddings in App.tsx
         and Controls.tsx. */
      :root {
        --sait: var(--discord-safe-area-inset-top, env(safe-area-inset-top, 0px));
        --saib: var(--discord-safe-area-inset-bottom, env(safe-area-inset-bottom, 0px));
        --sail: var(--discord-safe-area-inset-left, env(safe-area-inset-left, 0px));
        --sair: var(--discord-safe-area-inset-right, env(safe-area-inset-right, 0px));
      }

      /* Focus indication.
         Nothing styled :focus-visible, so every button fell back to Chromium's
         `outline: auto` ring — which `color-scheme: dark` below paints as a
         heavy white outline. It reads as a rendering glitch rather than a focus
         cue, and it lingers: a click leaves focus behind, then the next keypress
         (arrow keys scrolling a list, space, anything) flips the browser into
         keyboard modality and lights up whatever was last clicked, until focus
         moves again.
         Replacing it rather than removing it — keyboard users still need to see
         where they are, it just belongs in the app's own amber. */
      :focus-visible {
        outline: 2px solid rgba(229, 160, 13, 0.9);
        outline-offset: 2px;
      }
      /* Pointer focus leaves no ring. This is already how modern Chromium
         behaves, stated explicitly because the Activity runs in Discord's
         embedded webview rather than a browser we choose. */
      :focus:not(:focus-visible) {
        outline: none;
      }

      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }
      @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.4; transform: scale(0.85); } }
      /* Play/pause acknowledgement — the badge blooms outward and fades, so a
         click on the picture reads as having done something even when the frame
         under it hasn't changed yet. */
      @keyframes tap-ack {
        0%   { opacity: 0; transform: translate(-50%, -50%) scale(0.7); }
        22%  { opacity: 1; transform: translate(-50%, -50%) scale(1); }
        100% { opacity: 0; transform: translate(-50%, -50%) scale(1.5); }
      }
      /* Double-tap seek.

         Three things move, and all three restart on every tap rather than
         looping: a tap is an event, and an acknowledgement that was already
         running when you touched the screen does not read as a reply to you.

         The chevron takes a step forward, and the whole D swells and fades
         behind it. The swell is the shape itself, anchored at the edge of the
         screen so it grows inward — nothing about it depends on where the
         finger landed, which is a detail the gesture does not mean anything by.
         It is also the only thing that dims the picture, so nothing is left
         darkened between taps. */
      @keyframes seek-chevron {
        0%   { opacity: 0.35; transform: scale(0.9); }
        45%  { opacity: 1; transform: scale(1.06); }
        100% { opacity: 1; transform: scale(1); }
      }
      @keyframes seek-pulse {
        0%   { opacity: 0; transform: scale(0.84); }
        30%  { opacity: 1; transform: scale(1); }
        100% { opacity: 0; transform: scale(1.07); }
      }
      @media (prefers-reduced-motion: reduce) {
        /* The direction and the amount still read; nothing chases anything. */
        .seek-chevron { animation: none !important; }
        .seek-pulse { display: none !important; }
      }

      html {
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.15) transparent;
        /* Always reserve the scrollbar gutter so content width stays constant
           whether or not the vertical scrollbar is present. Without this, pages
           that don't overflow (e.g. a short search-result set) are ~thin-bar
           wider than pages that do, and centered elements like the search bar
           jump sideways between views. */
        scrollbar-gutter: stable;
        /* Hints the browser to render native form controls (scrollbars,
           select dropdowns) in a dark palette instead of the default light one. */
        color-scheme: dark;
      }
      html::-webkit-scrollbar, body::-webkit-scrollbar {
        width: 8px;
      }
      html::-webkit-scrollbar-track, body::-webkit-scrollbar-track {
        background: #0d0d0d;
      }
      html::-webkit-scrollbar-thumb, body::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
        border-radius: 4px;
      }
      html::-webkit-scrollbar-thumb:hover, body::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.28);
      }

      /* Themed horizontal scrollbar for hub/shelf rows — replaces the default
         light/white system scrollbar so it blends with the dark UI. */
      .scroll-row {
        scrollbar-width: thin;
        scrollbar-color: rgba(255,255,255,0.15) transparent;
      }
      .scroll-row::-webkit-scrollbar {
        height: 6px;
      }
      .scroll-row::-webkit-scrollbar-track {
        background: transparent;
      }
      .scroll-row::-webkit-scrollbar-thumb {
        background: rgba(255,255,255,0.15);
        border-radius: 3px;
      }
      .scroll-row::-webkit-scrollbar-thumb:hover {
        background: rgba(255,255,255,0.28);
      }

      /* Desktop-only poster shelf (see ScrollShelf.tsx). The scrollbar and the
         edge-fade chevrons stay invisible until the row is hovered; the chevrons
         also hide at whichever end the scroll has reached (.shelf-chev-dis). */
      .shelf { position: relative; }
      /* Hide the native scrollbar. It inherits <html>'s scrollbar-color, which
         makes Chromium render the standard bar (with end arrows) and ignore
         ::-webkit-scrollbar, so it's replaced by the drawn .shelf-bar below. */
      .shelf-scroller { scrollbar-width: none; }
      .shelf-scroller::-webkit-scrollbar { display: none; width: 0; height: 0; }
      /* Drawn scrollbar: a grey track with an amber thumb, spaced below the
         row and revealed on hover. */
      .shelf-bar {
        position: relative; height: 8px; margin-top: 6px; z-index: 4;
        background: rgba(255,255,255,0.08); border-radius: 4px;
        opacity: 0; transition: opacity 0.2s ease; cursor: pointer;
      }
      .shelf:hover .shelf-bar { opacity: 1; }
      .shelf-thumb {
        position: absolute; top: 0; height: 8px; min-width: 36px;
        background: rgba(229,160,13,0.85); border-radius: 4px; cursor: grab;
      }
      /* Invisible hit area so the thin 8px thumb is easy to grab. It's a child of
         the thumb, so pointer-downs on it still start the drag — it just extends
         the grabbable zone (mostly downward, into empty space, to avoid stealing
         clicks from the poster row above) without changing the visual size. */
      .shelf-thumb::before {
        content: ""; position: absolute;
        top: -6px; bottom: -12px; left: -4px; right: -4px;
      }
      .shelf-thumb:hover { background: rgba(229,160,13,1); }
      .shelf-chev {
        position: absolute; top: 0; width: 48px;
        display: flex; align-items: center;
        cursor: pointer; color: #fff; z-index: 4;
        opacity: 0; pointer-events: none;
        user-select: none; -webkit-user-select: none;
        transition: opacity 0.22s ease;
      }
      .shelf-chev > span {
        display: inline-block; font-size: 32px; line-height: 1;
        text-shadow: 0 1px 5px rgba(0,0,0,0.7);
        transition: transform 0.12s ease;
      }
      .shelf-chev:hover > span { transform: scale(1.28); }
      .shelf:hover .shelf-chev:not(.shelf-chev-dis) { opacity: 1; pointer-events: auto; }

      /* ── How a control answers ──────────────────────────────────────
         One vocabulary for every button in the app. A control that responds
         differently depending on which screen it is on reads as a different
         kind of thing, and most of them were responding not at all.

         `.btn` goes on things that *look* like buttons: a fill, a border, a
         shape you could press. Not on everything that happens to be a <button>
         element — that also covers poster cards, episode rows, breadcrumbs and
         "Show more", and it is wrong for all of them. Brightening a poster on
         hover washes out the picture you are trying to look at, and the cards
         already light their own edge amber, which is this app's way of saying
         "clickable". Bare text has no box to move: a dip lifts a word out of
         the line it sits in, and brightening coloured text only changes its
         colour. Adding it to those was a mechanical pass that stopped reading
         what it was labelling.

         Two rules, and deliberately only two:

           hover   brightens
           press   sinks a little

         Both were chosen to be safe everywhere rather than showy anywhere.
         Nothing grows and nothing glows: the poster rows are horizontal
         scrollers, and `overflow-x: auto` clips both axes at the content edge,
         so a card that scaled up would lose its border to the row's top and
         bottom and an outer glow would lose its outer side on the end cards.
         Brightening and moving stay inside the box, which is what lets the same
         two rules cover a poster, a pill and a bare icon alike.

         The press moves the button rather than scaling it. Scaling was the
         first answer and it is the wrong one for anything with a label: it
         resizes the text along with the box, so the words shrink and go soft
         for as long as the finger is down. A pixel of travel says the same
         thing and leaves the type exactly as it was.

         Nothing paints a background either. Icon buttons briefly got a wash
         behind them on hover, on the reasoning that brightening a glyph on
         nothing is fainter than brightening a filled pill. It is — but half of
         them have no border radius, so the wash arrived as a hard square
         around a round icon, which looks like a rendering fault rather than a
         hover state. A slightly quiet cue everywhere beats a loud one that is
         wrong on half the buttons.

         Expressed as `filter` and the standalone `translate` for a second
         reason: nearly every control here is styled inline, and an inline style
         beats a class for the same property. Those two are set inline almost
         nowhere, so the feedback lands rather than being silently discarded —
         which is what a `transform` or a `background` here would be.

         The press is quicker than the hover it interrupts so it arrives under
         the finger rather than catching up afterwards, and the curve is a
         plain decelerate: no overshoot, because a button that springs is a
         button you notice, and these should be felt rather than watched. */
      :root {
        --ui-press: 80ms;
        --ui-hover: 130ms;
        --ui-ease: cubic-bezier(0.2, 0, 0, 1);
      }
      .btn {
        transition: filter var(--ui-hover) var(--ui-ease),
                    translate var(--ui-press) var(--ui-ease);
      }
      .btn:hover:not(:disabled) { filter: brightness(1.14); }
      .btn:active:not(:disabled) { translate: 0 1px; filter: brightness(1.06); }
      @media (prefers-reduced-motion: reduce) {
        /* Keep the colour change — it is the half that says "this is a button"
           — and drop the movement. */
        .btn { transition: filter var(--ui-hover) linear; }
        .btn:active:not(:disabled) { translate: none; }
      }
      .shelf-chev-dis { opacity: 0 !important; pointer-events: none !important; }
      .shelf-chev-l {
        left: 0; justify-content: flex-start; padding-left: 12px;
        background-image: linear-gradient(to right, rgba(13,13,13,0.95), rgba(13,13,13,0.45) 42%, rgba(13,13,13,0));
      }
      .shelf-chev-r {
        right: 0; justify-content: flex-end; padding-right: 12px;
        background-image: linear-gradient(to left, rgba(13,13,13,0.95), rgba(13,13,13,0.45) 42%, rgba(13,13,13,0));
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
