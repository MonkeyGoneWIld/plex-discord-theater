<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PiP interaction checks</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #181b20; color: #eee; font: 14px system-ui, sans-serif; }
      main { padding: 32px; max-width: 650px; }
      button { font: inherit; cursor: pointer; }
      .tools { display: flex; flex-wrap: wrap; gap: 8px; }
      .tools button { padding: 9px 12px; background: #313842; color: #fff; border: 1px solid #596372; border-radius: 6px; }
      pre { white-space: pre-wrap; line-height: 1.7; }
      [data-presentation] video { background: linear-gradient(135deg, #233c46, #59755c 50%, #222a36); }
      #rect { position: fixed; bottom: 0; left: 0; font: 12px monospace; padding: 4px; pointer-events: none; z-index: 120; background: #000b; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./pip-interactions.tsx"></script></body>
</html>
