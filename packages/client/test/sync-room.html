<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sync room checks</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; background: #181b20; color: #eee; font: 14px system-ui, sans-serif; }
      .bar { padding: 12px 16px; display: flex; gap: 16px; align-items: flex-start; }
      .bar button { font: inherit; padding: 8px 14px; background: #313842; color: #fff; border: 1px solid #596372; border-radius: 6px; cursor: pointer; }
      pre { margin: 0; white-space: pre-wrap; line-height: 1.6; }
      .frames { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 0 16px 16px; }
      iframe { width: 100%; aspect-ratio: 16 / 9; border: 1px solid #333; background: #000; }
    </style>
  </head>
  <body><div id="root"></div><script type="module" src="./sync-room.tsx"></script></body>
</html>
